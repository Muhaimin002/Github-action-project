name: CICD Pipeline

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cicd-${{ github.ref }}
  cancel-in-progress: false

env:
  AWS_REGION: ap-south-1
  EKS_CLUSTER: devopsshack-cluster
  K8S_MANIFEST: ds.yml
  DOCKER_IMAGE_NAME: bankapp

jobs:
  compile:
    name: Compile
    runs-on: self-hosted
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Verify Maven
        run: mvn -version

      - name: Compile application
        run: mvn -B compile

  security-check:
    name: Security Scan
    runs-on: self-hosted
    needs: compile
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Resolve dependencies
        run: mvn -B dependency:resolve

      - name: Install Trivy
        shell: bash
        run: |
          if ! command -v trivy >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y wget gnupg

            wget -qO- https://aquasecurity.github.io/trivy-repo/deb/public.key \
              | sudo gpg --dearmor --yes \
                  -o /usr/share/keyrings/trivy.gpg

            echo "deb [signed-by=/usr/share/keyrings/trivy.gpg] https://aquasecurity.github.io/trivy-repo/deb $(. /etc/os-release && echo "$VERSION_CODENAME") main" \
              | sudo tee /etc/apt/sources.list.d/trivy.list

            sudo apt-get update
            sudo apt-get install -y trivy
          fi

      - name: Scan dependencies and filesystem
        run: trivy fs --scanners vuln --exit-code 0 .

      - name: Install Gitleaks
        shell: bash
        run: |
          if ! command -v gitleaks >/dev/null 2>&1; then
            VERSION="8.24.2"

            wget -q \
              "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz" \
              -O /tmp/gitleaks.tar.gz

            tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
            sudo install /tmp/gitleaks /usr/local/bin/gitleaks
          fi

      - name: Scan for secrets
        run: gitleaks detect --source . --redact --exit-code 1

  test:
    name: Unit Tests
    runs-on: self-hosted
    needs: security-check
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Run unit tests
        run: mvn -B test

  build_project_and_sonar_scan:
    name: Coverage, Build and SonarQube
    runs-on: self-hosted
    needs: test
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build, test and enforce Maven coverage rules
        run: mvn -B clean verify

      - name: Verify JaCoCo XML report
        run: |
          test -s target/site/jacoco/jacoco.xml
          echo "JaCoCo XML report exists"
          ls -lh target/site/jacoco/jacoco.xml

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-jar
          path: target/*.jar
          if-no-files-found: error

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v5.0.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
        with:
          args: >
            -Dsonar.projectKey=GC-Bank
            -Dsonar.sources=src/main/java
            -Dsonar.tests=src/test/java
            -Dsonar.java.binaries=target/classes
            -Dsonar.java.test.binaries=target/test-classes
            -Dsonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml

      - name: SonarQube Quality Gate Check
        id: quality-gate
        uses: sonarsource/sonarqube-quality-gate-action@v1.2.0
        timeout-minutes: 10
        with:
          pollingTimeoutSec: 600
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}

      - name: Show Quality Gate status
        if: always()
        env:
          QUALITY_GATE_STATUS: ${{ steps.quality-gate.outputs.quality-gate-status }}
        run: echo "Quality Gate status = ${QUALITY_GATE_STATUS}"

  build_docker_image_and_push:
    name: Build and Push Docker Image
    runs-on: self-hosted
    needs: build_project_and_sonar_scan
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Dockerfile does: COPY app/*.jar $APP_HOME/app.jar
      - name: Download JAR artifact
        uses: actions/download-artifact@v4
        with:
          name: app-jar
          path: app/

      - name: List JARs (must be exactly one)
        shell: bash
        run: |
          ls -lh app/
          COUNT=$(ls app/*.jar | wc -l)
          if [ "$COUNT" -ne 1 ]; then
            echo "Expected exactly 1 JAR in app/, found $COUNT"
            exit 1
          fi

      - name: Validate and clean Docker Hub username
        id: dh
        env:
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
        shell: bash
        run: |
          USER_CLEAN="$(printf '%s' "$DOCKERHUB_USERNAME" | tr -d '[:space:]' | tr '[:upper:]' '[:lower:]')"
          if [ -z "$USER_CLEAN" ]; then
            echo "Missing DOCKERHUB_USERNAME repository variable"
            exit 1
          fi
          echo "user=$USER_CLEAN" >> "$GITHUB_OUTPUT"

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ steps.dh.outputs.user }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ steps.dh.outputs.user }}/${{ env.DOCKER_IMAGE_NAME }}:latest
            ${{ steps.dh.outputs.user }}/${{ env.DOCKER_IMAGE_NAME }}:${{ github.sha }}

  deploy_to_kubernetes:
    name: Deploy to Amazon EKS
    runs-on: self-hosted
    needs: build_docker_image_and_push
    timeout-minutes: 20

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate and clean Docker Hub username
        id: dh
        env:
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
        shell: bash
        run: |
          USER_CLEAN="$(printf '%s' "$DOCKERHUB_USERNAME" | tr -d '[:space:]' | tr '[:upper:]' '[:lower:]')"
          if [ -z "$USER_CLEAN" ]; then
            echo "Missing DOCKERHUB_USERNAME repository variable"
            exit 1
          fi
          echo "user=$USER_CLEAN" >> "$GITHUB_OUTPUT"

      - name: Install AWS CLI if missing
        shell: bash
        run: |
          if ! command -v aws >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y unzip curl
            ARCH="$(uname -m)"
            curl -s "https://awscli.amazonaws.com/awscli-exe-linux-${ARCH}.zip" -o /tmp/awscliv2.zip
            unzip -q -o /tmp/awscliv2.zip -d /tmp
            sudo /tmp/aws/install --update
          fi
          aws --version

      - name: Configure AWS credentials using OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: latest

      - name: Configure EKS kubeconfig
        run: |
          aws eks update-kubeconfig \
            --region "$AWS_REGION" \
            --name "$EKS_CLUSTER"

      - name: Verify Kubernetes connection
        run: kubectl get nodes

      - name: Update Deployment image
        env:
          DOCKERHUB_USERNAME: ${{ steps.dh.outputs.user }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          kubectl set image -f "$K8S_MANIFEST" \
            "*=${DOCKERHUB_USERNAME}/${DOCKER_IMAGE_NAME}:${IMAGE_TAG}" \
            --local -o yaml > /tmp/deployment-updated.yaml

          kubectl apply -f /tmp/deployment-updated.yaml

      - name: Verify rollout
        run: |
          kubectl rollout status \
            -f "$K8S_MANIFEST" \
            --timeout=180s

```yaml
name: CICD Pipeline

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:
  compile:
    name: Compile Java Application
    runs-on: self-hosted

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Verify Java and Maven
        run: |
          java -version
          mvn -version

      - name: Compile with Maven
        run: mvn -B compile

  security-check:
    name: Security Scan
    runs-on: self-hosted
    needs: compile

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: maven

      - name: Resolve Maven dependencies
        run: mvn -B dependency:resolve

      - name: Install Trivy
        shell: bash
        run: |
          if ! command -v trivy >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y wget gnupg

            wget -qO- https://aquasecurity.github.io/trivy-repo/deb/public.key \
              | sudo gpg --dearmor --yes

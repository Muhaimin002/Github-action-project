name: CICD Pipeline

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cicd-${{ github.ref }}
  cancel-in-progress: false

env:
  AWS_REGION: ap-south-1
  EKS_CLUSTER: devopsshack-cluster
  K8S_MANIFEST: ds.yml
  DOCKER_IMAGE_NAME: bankapp

jobs:
  compile:
    name: Compile
    runs-on: self-hosted
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Verify Maven
        run: mvn -version

      - name: Compile application
        run: mvn -B compile

  security-check:
    name: Security Scan
    runs-on: self-hosted
    needs: compile
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Resolve dependencies
        run: mvn -B dependency:resolve

      - name: Install Trivy
        shell: bash
        run: |
          if ! command -v trivy >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y wget gnupg

            wget -qO- https://aquasecurity.github.io/trivy-repo/deb/public.key \
              | sudo gpg --dearmor --yes \
                  -o /usr/share/keyrings/trivy.gpg

            echo "deb [signed-by=/usr/share/keyrings/trivy.gpg] https://aquasecurity.github.io/trivy-repo/deb $(. /etc/os-release && echo "$VERSION_CODENAME") main" \
              | sudo tee /etc/apt/sources.list.d/trivy.list

            sudo apt-get update
            sudo apt-get install -y trivy
          fi

      - name: Scan dependencies and filesystem
        run: trivy fs --scanners vuln --exit-code 0 .

      - name: Install Gitleaks
        shell: bash
        run: |
          if ! command -v gitleaks >/dev/null 2>&1; then
            VERSION="8.24.2"

            wget -q \
              "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz" \
              -O /tmp/gitleaks.tar.gz

            tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
            sudo install /tmp/gitleaks /usr/local/bin/gitleaks
          fi

      - name: Scan for secrets
        run: gitleaks detect --source . --redact --exit-code 1

  test:
    name: Unit Tests
    runs-on: self-hosted
    needs: security-check
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Run unit tests
        run: mvn -B test

  build_project_and_sonar_scan:
    name: Coverage, Build and SonarQube
    runs-on: self-hosted
    needs: test
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build, test and enforce Maven coverage rules
        run: mvn -B clean verify

      - name: Verify JaCoCo XML report
        run: |
          test -s target/site/jacoco/jacoco.xml
          echo "JaCoCo XML report exists"
          ls -lh target/site/jacoco/jacoco.xml

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-jar
          path: target/*.jar
          if-no-files-found: error

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v5.0.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
        with:
          args: >
            -Dsonar.projectKey=GC-Bank
            -Dsonar.sources=src/main/java
            -Dsonar.tests=src/test/java
            -Dsonar.java.binaries=target/classes
            -Dsonar.java.test.binaries=target/test-classes
            -Dsonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml

      - name: SonarQube Quality Gate Check
        id: quality-gate
        uses: sonarsource/sonarqube-quality-gate-action@v1.2.0
        timeout-minutes: 10
        with:
          pollingTimeoutSec: 600
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}

      - name: Show Quality Gate status
        if: always()
        env:
          QUALITY_GATE_STATUS: ${{ steps.quality-gate.outputs.quality-gate-status }}
        run:

name: CICD Pipeline

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  compile:
    name: Compile
    runs-on: self-hosted

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Verify Maven
        run: mvn -version

      - name: Compile application
        run: mvn -B compile

  security-check:
    name: Security Scan
    runs-on: self-hosted
    needs: compile

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Resolve dependencies
        run: mvn -B dependency:resolve

      - name: Install Trivy
        shell: bash
        run: |
          if ! command -v trivy >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y wget gnupg
            wget -qO- https://aquasecurity.github.io/trivy-repo/deb/public.key | sudo gpg --dearmor --yes -o /usr/share/keyrings/trivy.gpg
            echo "deb [signed-by=/usr/share/keyrings/trivy.gpg] https://aquasecurity.github.io/trivy-repo/deb $(. /etc/os-release && echo "$VERSION_CODENAME") main" | sudo tee /etc/apt/sources.list.d/trivy.list
            sudo apt-get update
            sudo apt-get install -y trivy
          fi

      - name: Scan dependencies and filesystem
        run: trivy fs --scanners vuln --exit-code 0 .

      - name: Install Gitleaks
        shell: bash
        run: |
          if ! command -v gitleaks >/dev/null 2>&1; then
            VERSION="8.24.2"
            wget -q "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz" -O /tmp/gitleaks.tar.gz
            tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
            sudo install /tmp/gitleaks /usr/local/bin/gitleaks
          fi

      - name: Scan for secrets
        run: gitleaks detect --source . --redact --exit-code 1

  test:
    name: Unit Tests
    runs-on: self-hosted
    needs: security-check

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Run unit tests
        run: mvn -B test

  build_project_and_sonar_scan:
    name: Coverage, Build and SonarQube
    runs-on: self-hosted
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: maven

      - name: Build, test and enforce 80% coverage
        run: mvn -B clean verify

      - name: Verify JaCoCo XML report
        run: |
          test -s target/site/jacoco/jacoco.xml
          echo "JaCoCo XML report exists"
          ls -lh target/site/jacoco/jacoco.xml
          grep -o '<counter type="LINE"[^>]*/>' target/site/jacoco/jacoco.xml | tail -1

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-jar
          path: target/*.jar
          if-no-files-found: error

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v5.0.0
        with:
          args: >
            -Dsonar.projectKey=GC-Bank
            -Dsonar.sources=src/main/java
            -Dsonar.tests=src/test/java
            -Dsonar.java.binaries=target/classes
            -Dsonar.java.test.binaries=target/test-classes
            -Dsonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}

      - name: SonarQube Quality Gate Check
        id: sonarqube-quality-gate-check
        uses: sonarsource/sonarqube-quality-gate-action@v1.2.0
        timeout-minutes: 10
        with:
          pollingTimeoutSec: 600
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}

      - name: Show quality gate status
        if: always()
        run: echo "Quality gate status = ${{ steps.sonarqube-quality-gate-check.outputs.quality-gate-status }}"

  build_docker_image_and_push:
    name: Build and Push Docker Image
    runs-on: self-hosted
    needs: build_project_and_sonar_scan

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download JAR artifact
        uses: actions/download-artifact@v4
        with:
          name: app-jar
          path: app  # downloads the JAR into ./app

      - name: Set image name
        id: img
        env:
          DH_USER: ${{ vars.DOCKERHUB_USERNAME }}
        run: |
          USER_CLEAN="$(printf '%s' "$DH_USER" | tr -d '[:space:]')"
          if [ -z "$USER_CLEAN" ]; then
            echo "DOCKERHUB_USERNAME variable is empty"
            exit 1
          fi
          echo "user=${USER_CLEAN}" >> "$GITHUB_OUTPUT"
          echo "name=${USER_CLEAN}/bankapp" >> "$GITHUB_OUTPUT"
          echo "Image name: ${USER_CLEAN}/bankapp"

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ steps.img.outputs.user }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ steps.img.outputs.name }}:latest
            ${{ steps.img.outputs.name }}:${{ github.sha }}
            
  deploy_to_kubernetes:
    runs-on: self-hosted
    needs: build_docker_image_and_push

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: latest

      - name: Configure EKS kubeconfig
        run: |
          aws eks update-kubeconfig \
            --region ap-south-1 \
            --name devopsshack-cluster

      - name: Verify Kubernetes connection
        run: kubectl get nodes

      - name: Deploy to EKS
        run: kubectl apply -f ds.yml

